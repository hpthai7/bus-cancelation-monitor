name: IDFM Bus 5150 Cancellation Monitor

on:
  schedule:
    # Mon-Fri Morning window: 06:00 - 09:30 CEST (04:00 - 07:30 UTC) - Every 5 mins
    - cron: '*/5 4-7 * * 1-5'
    # Mon-Fri Afternoon/Evening window: 14:00 - 19:30 CEST (12:00 - 17:30 UTC) - Every 5 mins
    - cron: '*/5 12-17 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  check-bus-5150:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --production

      - name: Run IDFM Bus 5150 Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IDFM_PRIM_TOKEN: ${{ secrets.IDFM_PRIM_TOKEN }}
        run: npm start
