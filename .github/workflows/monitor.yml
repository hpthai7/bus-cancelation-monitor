name: IDFM Bus 5150 Cancellation Monitor

on:
  push:
    branches:
      - main
  schedule:
    # Morning Commute Window (Mon, Tue, Thu, Fri 06:00-09:30 CEST = 04:00-07:30 UTC)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 4-7 * * 1,2,4,5'
    # Evening Commute Window (Mon, Tue, Thu, Fri 15:00-19:30 CEST = 13:00-17:30 UTC)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 13-17 * * 1,2,4,5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  check-bus-5150:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run IDFM Bus 5150 Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IDFM_PRIM_TOKEN: ${{ secrets.IDFM_PRIM_TOKEN }}
          TWITTER_RSS_URL: ${{ secrets.TWITTER_RSS_URL }}
        run: |
          echo "🚀 Scheduled workflow triggered at $(date -u)"
          npm start
