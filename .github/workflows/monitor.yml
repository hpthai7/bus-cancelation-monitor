name: IDFM Bus 5150 Cancellation Monitor

on:
  schedule:
    # Offset 5-min interval to bypass top-of-hour GitHub runner queue congestion
    - cron: '2-57/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  check-bus-5150:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run IDFM Bus 5150 Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IDFM_PRIM_TOKEN: ${{ secrets.IDFM_PRIM_TOKEN }}
          TWITTER_RSS_URL: ${{ secrets.TWITTER_RSS_URL }}
        run: |
          echo "🚀 Scheduled workflow triggered at $(date -u)"
          npm start
