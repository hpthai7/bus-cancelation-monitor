name: IDFM Bus 5150 Cancellation Monitor

on:
  schedule:
    # Standard 5-minute interval cron
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  check-bus-5150:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install --production

      - name: Run IDFM Bus 5150 Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IDFM_PRIM_TOKEN: ${{ secrets.IDFM_PRIM_TOKEN }}
          TWITTER_RSS_URL: ${{ secrets.TWITTER_RSS_URL }}
        run: npm start
